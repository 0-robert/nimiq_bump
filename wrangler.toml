name = "bump"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

# Custom domains on a zone already on the account. workers.dev would have put
# the account name in every link.
routes = [{ pattern = "prod.bump.roberthq.com", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "SLOT"
class_name = "Slot"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Slot"]

[ai]
binding = "AI"

[vars]
NETWORK_ID = "24"
RPC_URL = "https://rpc.nimiqwatch.com"
FLOOR_NIM = "100"
CLOSE_HOUR_UTC = "19"
CLAIM_SECONDS = "60"
# Receives the opening bid of round 1 only. Every later round pays the previous winner.
GENESIS_ADDRESS = "NQ05 L4NV YHX4 S8QV 4HT3 TVUU JE8D 2SHD BH2Y"

# Testnet. Deploys as a second worker so the payment path can be exercised on a
# phone with free test NIM before anything real is at stake. No public JSON-RPC
# node exists for testnet, so this one reads the REST explorer instead.
[env.test]
name = "bump-test"
routes = [{ pattern = "test.bump.roberthq.com", custom_domain = true }]
[[env.test.durable_objects.bindings]]
name = "SLOT"
class_name = "Slot"
[env.test.ai]
binding = "AI"
[env.test.vars]
NETWORK_ID = "5"
RPC_URL = "https://test-api.nimiq.watch/api/v1"
FLOOR_NIM = "100"
CLOSE_HOUR_UTC = "19"
CLAIM_SECONDS = "60"
GENESIS_ADDRESS = "NQ05 L4NV YHX4 S8QV 4HT3 TVUU JE8D 2SHD BH2Y"
